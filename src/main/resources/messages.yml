  help-header: "<dark_gray>―――― <white>LiuGuild 帮助</white> <dark_gray>――――"
  help-line: "<gray>/guild <white>create|join|leave|invite|accept|kick|promote|seticon|set|bank|info|list|top|war|gui"
  reload-done: "<green>配置已重载。"

  # ---- 通用 ----
