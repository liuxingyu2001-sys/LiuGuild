  rename-usage: "<red>用法：<white>/guild rename <新名称> [新标签]</white>"
  rename-input-name: "<gray>请输入工会的新名称（输入 cancel 取消）："
  rename-input-tag: "<gray>请输入新标签（2~5 字符，如 SKY；留空 = 不修改）："
