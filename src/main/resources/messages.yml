  bank-deposit: "<green>已存入 <white>{amount}</white> 到工会银行，当前余额 <white>{balance}</white>。"
  bank-withdraw: "<green>已从工会银行取出 <white>{amount}</white>，当前余额 <white>{balance}</white>。"
  bank-insufficient: "<red>工会银行余额不足。"
