# ==========================================================
#  LiuGuild · 工会战全局模块（war.yml）
#  仅全局开关与「所有模式的默认值」。
#  具体模式（匹配 / 赛季 / 自定义）见 war-modes.yml，也可在下方与 defaults 同级直接写模式规则；
#  场地见 arena.yml；统一装备见 kit.yml。
# ==========================================================

war:
  enabled: true
  # 竞技场承办服配置在 arena.yml 的 arenas.<id>.server，无需开启承办模式。

  # 匹配队列轮询间隔（秒）
  queue-interval-seconds: 5
  # 发起匹配后等待对手的最长时间（秒），0 = 不超时
  match-timeout-seconds: 180
  # 默认模式（未指定时使用）
  default-mode: match
  # 有玩家点击参与匹配时是否全服广播（含跨服广播；模式可单独覆盖）
  broadcast-queue: true
  # 比赛期间显示比分 BossBar（比分 + 剩余时间）。
  bossbar: true
  # 结算阶段每 tick 分帧发放奖励的人数（大名单时避免一次性阻塞主线程）。
  settle-batch-per-tick: 8
  # 匹配工会战事件是否通过 LiuChat 全服（含跨服）公告；
  # 未安装 LiuChat 或公告失败时只通知参赛工会，避免刷屏与重复消息。
  announce-server: true
  # 匹配成功后是否自动把双方在线成员强制传送进竞技场并参战（无需手动 /guild war join）。
  # 关闭后才会在「匹配成功」消息里附带 [点击进入竞技场] 按钮。
  auto-enter: true

  # ----------------------------------------------------------
  #  所有工会战模式的公共默认值；模式里未写的项继承这里。
  #  模式里显式写出的项优先，因此可以给不同模式配置不同规则：
  #  例如 match 用 fair-equipment: true，另建一个模式写 false 即可使用玩家自己的装备。
  #  broadcast-queue 未在 defaults 里配置时，模式继承上方的 war.broadcast-queue。
  # ----------------------------------------------------------
  defaults:
    enabled: true
    # 是否发放完全相同的公平装备
    fair-equipment: true
    # 是否屏蔽 LuckyPeaches 等额外血量，保证公平血量
    fair-health: true
    # kit.yml 中的装备套装 key
    kit: default
    team-size: 10
    min-members: 1
    min-level: 1
    lives:
      per-player: 3
      balance-teams: true
      respawn-delay-seconds: 3
    prepare-seconds: 15
    duration-seconds: 600
    settle-seconds: 10
    allow-spectators: true
    # 准备阶段锁定参赛者（冻结移动/视角/跳跃/交互），倒计时结束才放开
    freeze-on-prepare: true
    allow-jump-on-prepare: false
    prepare-platform: true
    score:
      kill: 1
      death: -1
    rewards:
      win-player-money: 500.0
      lose-player-money: 100.0
      # 工会资金（点数）奖励；上调前请留意 daily-guild-funds-cap，避免单日刷过多
      win-guild-funds: 800
      lose-guild-funds: 100
      # 每个工会每天最多通过工会战获得的工会资金（0 = 不限）；模式可单独覆盖
      daily-guild-funds-cap: 2000
      win-pass-xp: 500
      lose-pass-xp: 100
      pass-id: ""
      win-title-id: 0
      # 自定义额外奖励（名称 + 指令，scope 可设 both/win/lose）
      # 占位符：{player} {uuid} {guild} {guild_id} {mode} {score} {enemy_score}
      extra: []

  # ----------------------------------------------------------
  #  可选：直接在 war.yml 里写模式专属规则（与 defaults 同级）。
  #  未写的项继承 defaults；同名模式仍以 war-modes.yml 为准。
  #  不能使用 defaults / modes / score / lives / rewards 这些保留名。
  # ----------------------------------------------------------
  # match:
  #   fair-equipment: true
  #   fair-health: true
  # owngear:
  #   enabled: true
  #   display: "自带装备工会战"
  #   arena: pvp
  #   fair-equipment: false
  #   fair-health: false
  #   prepare-seconds: 10
  #   duration-seconds: 600
