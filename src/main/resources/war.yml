# ==========================================================
#  LiuGuild · 工会战全局模块（war.yml）
#  仅全局开关与「所有模式的默认值」。
#  具体模式（匹配 / 赛季 / 自定义）见 war-modes.yml；
#  场地见 arena.yml；统一装备见 kit.yml。
# ==========================================================

war:
  enabled: true
  # true = 本服为工会战专属承办服（竞技场服），只承接工会战
  server-mode: false
  # 全局默认承办服 server-id；留空 = 由发起匹配的服务器承办
  # 模式可在 war-modes.yml 里用 dedicated-server 单独覆盖
  dedicated-server: ""

  # 匹配队列轮询间隔（秒）
  queue-interval-seconds: 5
  # 发起匹配后等待对手的最长时间（秒），0 = 不超时
  match-timeout-seconds: 180
  # 默认模式（未指定时使用）
  default-mode: match
  # 有玩家点击参与匹配时是否全服广播（模式可单独覆盖）
  broadcast-queue: true
  # 比赛期间显示比分 BossBar（比分 + 剩余时间）。
  bossbar: true
  # 结算阶段每 tick 分帧发放奖励的人数（大名单时避免一次性阻塞主线程）。
  settle-batch-per-tick: 8
  # 工会战事件是否全服（含跨服）公告；默认仅通知参赛工会，避免刷屏与重复消息。
  announce-server: false

  # ----------------------------------------------------------
  #  所有工会战模式的公共默认值；模式里未写的项继承这里
  # ----------------------------------------------------------
  defaults:
    enabled: true
    # 是否发放完全相同的公平装备
    fair-equipment: true
    # 是否屏蔽 LuckyPeaches 等额外血量，保证公平血量
    fair-health: true
    # kit.yml 中的装备套装 key
    kit: default
    # 战斗期间死亡是否保留物品
    keep-inventory: false
    team-size: 10
    min-members: 1
    min-level: 1
    lives:
      per-player: 3
      balance-teams: true
      respawn-delay-seconds: 3
    prepare-seconds: 30
    duration-seconds: 600
    settle-seconds: 10
    allow-spectators: true
    score:
      kill: 1
      death: -1
      objective: 5
    rewards:
      win-player-money: 500.0
      lose-player-money: 100.0
      win-guild-funds: 5000
      lose-guild-funds: 1000
      win-pass-xp: 500
      lose-pass-xp: 100
      pass-id: ""
      win-title-id: 0
