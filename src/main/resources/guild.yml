# ==========================================================
#  LiuGuild · 工会玩法模块（guild.yml）
#  仅本文件负责「工会」相关设置，与 war.yml / kit.yml 解耦。
# ==========================================================

guild:
  name:
    min-length: 2
    max-length: 16
  tag:
    min-length: 2
    max-length: 5
  # 创建费用（需 Vault 经济；无经济插件时忽略）
  create-cost: 30000.0
  # 基础成员上限
  max-members: 50
  # 每提升 1 级增加的成员上限
  max-members-per-level: 5
  invite:
    expire-seconds: 300
    cooldown-seconds: 30
  bank:
    enabled: true
    # 存款手续费百分比：5 = 5%，0 = 不收（代码按 /100 换算）
    deposit-tax-percent: 5.0
  level:
    base-required-points: 1000
    required-growth: 1.5
    max-level: 20
  # 新工会的成员 PvP 默认值；未单独设置过的旧工会也回退到此值。
  # 已有工会可在 GUI「工会设置」中单独开关。true = 同会成员可以互相攻击；false = 同会成员免伤。
  friendly-fire: false
  # 官员（副会长）权限
  officer:
    invite: true
    kick: true
    declare-war: true
    set-notice: true
    # 官员是否可设置/删除工会驻地（此前复用 set-notice，关掉改公告会连带收回驻地权限）
    set-home: true
  # 工会图标：见 icons.yml 定义可用图标
  icon:
    # 新工会默认图标 id（对应 icons.yml 的键）
    default: "default"
    # 更换图标费用（需 Vault）
    change-cost: 5000.0
  # 工会驻地（需 HuskHomes；未安装时自动禁用）
  home:
    enabled: true
    # 最多可用驻地数量（受等级限制）
    max-slots: 3
    # 每多少级多开放 1 个驻地
    levels-per-slot: 5
    # 传送冷却（秒）
    cooldown-seconds: 30
    # 传送前等待（秒，0 = 立即；需在 HuskHomes 允许范围内）
    warmup-seconds: 3
    # 工会战期间是否禁止使用驻地
    deny-in-war: true
  # 每日工会签到
  checkin:
    enabled: true
    # 每日签到消耗的个人金币（Vault，0 = 不收费）
    cost: 0.0
    # 每日签到消耗的工会资金（点数，0 = 不扣）
    guild-cost: 0
    # 每日签到获得个人工会资金（可自愿捐给工会，不可兑换金币）
    points: 10
    # 每日签到获得个人金币（需经济插件，0 = 不发）
    money: 0.0
    # 每连续签到 1 天的额外工会资金
    streak-bonus: 5
    # 连续奖励上限
    max-streak-bonus: 50
    # 是否向全会成员广播签到
    broadcast: true
  # 玩家在线活跃 → 工会资金
  # 只统计「活跃」在线成员（afk-seconds 内移动/交互/战斗/钓鱼过），避免挂机白嫖
  activity:
    enabled: true
    # 结算间隔（秒，至少 30）
    interval-seconds: 300
    # 每个活跃在线成员每次结算贡献的工会资金
    points-per-player: 2
    # 每个工会每天最多通过在线活跃获得的工会资金（0 = 不限）
    daily-cap: 1000
    # 多久没有任何操作算挂机（秒，0 = 不检测，纯在线即算）
    afk-seconds: 180
    # 至少需要多少名活跃成员才结算（0 = 有 1 名即可）
    min-online: 1
  # 工会改名字
  rename:
    # 是否允许会长改名字（/guild rename 或设置菜单）
    enabled: true
    # 冷却（秒）；0 = 不限
    cooldown-seconds: 3600
    # 费用（Vault 金币）；0 = 免费
    cost: 1000.0
    # 是否允许同时修改标签（tag，如 [SKY]）
    allow-tag: true
  # 固定工会头衔：仅管理员编辑配置，玩家只能装备/卸下
  titles:
    enabled: true
    # 最多45个；min-rank 是最低可用职位
    presets:
      member:
        display: "<white>工会成员"
        min-rank: MEMBER
      officer:
        display: "<aqua>工会官员"
        min-rank: OFFICER
      leader:
        display: "<gold>工会会长"
        min-rank: LEADER
  # 工会商店：仅出售库存商品，Vault 收入进工会金币银行，不提供收购
  # 商店严格按工会隔离：每个工会的商店物品独立，工会之间互不可见/不可购买
  shop:
    enabled: true
    # 每个工会最多上架几条（各工会单独计算，默认 10）
    max-listings: 10
    # 单条上架最多多少件
    max-stack-per-listing: 2304
    # 单次购买上限
    max-per-purchase: 2304
    # 单次向工会供货上限
    max-supply: 2304
    # 交易税（%），从货款里扣
    tax-percent: 5.0
    # 谁能上架/改价/下架（MEMBER / OFFICER / LEADER）
    manage-rank: OFFICER
  # 僵尸工会清理（不活跃工会）
  cleanup:
    # 自动定期清理开关（默认关闭，建议先用 dry-run 确认）
    enabled: false
    # 判定标准：连续多少天无活动且无人在线
    inactive-days: 30
    # 自动检查间隔（分钟）
    interval-minutes: 360
    # 仅清理成员数不超过该值的工会（0 = 不限；用于保护大型工会）
    max-members: 0
    # 试运行：只记录不删除
    dry-run: false
    # 清理时是否全服广播
    broadcast: false
