# ==========================================================
#  LiuGuild · 工会玩法模块（guild.yml）
#  仅本文件负责「工会」相关设置，与 war.yml / kit.yml 解耦。
# ==========================================================

guild:
  name:
    min-length: 2
    max-length: 16
  tag:
    min-length: 2
    max-length: 5
  # 创建费用（需 Vault 经济；无经济插件时忽略）
  create-cost: 30000.0
  # 基础成员上限
  max-members: 50
  # 每提升 1 级增加的成员上限
  max-members-per-level: 5
  invite:
    expire-seconds: 300
    cooldown-seconds: 30
  bank:
    enabled: true
    # 存款手续费百分比（0 = 不收）
    deposit-tax-percent: 0.05
  level:
    base-required-points: 1000
    required-growth: 1.5
    max-level: 20
  # 同会成员之间是否免伤（true = 允许互相攻击，默认 false）
  friendly-fire: false
  # 官员（副会长）权限
  officer:
    invite: true
    kick: true
    declare-war: true
    set-notice: true
  # 工会图标：见 icons.yml 定义可用图标
  icon:
    # 新工会默认图标 id（对应 icons.yml 的键）
    default: "default"
    # 更换图标费用（需 Vault）
    change-cost: 5000.0
  # 工会驻地（需 HuskHomes；未安装时自动禁用）
  home:
    enabled: true
    # 最多可用驻地数量（受等级限制）
    max-slots: 3
    # 每多少级多开放 1 个驻地
    levels-per-slot: 5
    # 传送冷却（秒）
    cooldown-seconds: 30
    # 传送前等待（秒，0 = 立即；需在 HuskHomes 允许范围内）
    warmup-seconds: 3
    # 工会战期间是否禁止使用驻地
    deny-in-war: true
  # 每日工会签到
  checkin:
    enabled: true
    # 每日签到消耗的个人金币（Vault，0 = 不收费）
    cost: 0.0
    # 每日签到消耗的工会资金（点数，0 = 不扣）
    guild-cost: 0
    # 每日签到获得个人工会资金（可自愿捐给工会，不可兑换金币）
    points: 10
    # 每日签到获得个人金币（需经济插件，0 = 不发）
    money: 0.0
    # 每连续签到 1 天的额外工会资金
    streak-bonus: 5
    # 连续奖励上限
    max-streak-bonus: 50
    # 是否向全会成员广播签到
    broadcast: true
  # 玩家在线活跃 → 工会资金
  # 只统计「活跃」在线成员（afk-seconds 内移动/交互/战斗/钓鱼过），避免挂机白嫖
  activity:
    enabled: true
    # 结算间隔（秒，至少 30）
    interval-seconds: 300
    # 每个活跃在线成员每次结算贡献的工会资金
    points-per-player: 2
    # 每个工会每天最多通过在线活跃获得的工会资金（0 = 不限）
    daily-cap: 1000
    # 多久没有任何操作算挂机（秒，0 = 不检测，纯在线即算）
    afk-seconds: 180
    # 至少需要多少名活跃成员才结算（0 = 有 1 名即可）
    min-online: 1
  # 工会改名字
  rename:
    # 是否允许会长改名字（/guild rename 或设置菜单）
    enabled: true
    # 冷却（秒）；0 = 不限
    cooldown-seconds: 3600
    # 费用（Vault 金币）；0 = 免费
    cost: 1000.0
    # 是否允许同时修改标签（tag，如 [SKY]）
    allow-tag: true
  # 工会头衔：工会自定义的显示称号，成员从自己够格的里选一个装备
  titles:
    enabled: true
    # 每个工会最多可创建几个头衔
    max: 12
    # 谁能创建/删除头衔（MEMBER / OFFICER / LEADER）
    manage-rank: OFFICER
  # 工会商店：仅出售库存商品，Vault 收入进工会金币银行，不提供收购
  # 商店严格按工会隔离：每个工会的商店物品独立，工会之间互不可见/不可购买
  shop:
    enabled: true
    # 每个工会最多上架几条（各工会单独计算，默认 10）
    max-listings: 10
    # 单条上架最多多少件
    max-stack-per-listing: 2304
    # 单次购买上限
    max-per-purchase: 2304
    # 单次向工会供货上限
    max-supply: 2304
    # 交易税（%），从货款里扣
    tax-percent: 5.0
    # 谁能上架/改价/下架（MEMBER / OFFICER / LEADER）
    manage-rank: OFFICER
  # 工会仓库：跨服共享物品存储，同一时刻只允许一个成员打开（跨服原子锁）
  # 使用时间与容量升级均消耗【工会资金（点数）】，与工会银行（Vault 金币）无关。
  warehouse:
    enabled: true
    # 是否必须先购买使用时间才能打开；false = 永久可用（旧行为，不消耗点数）
    require-rent: true
    # 逻辑堆叠容量，每个同类物品可存 21 亿件；界面每页45类，非9倍数向上取整
    base-slots: 45
    # 每购买1次升级增加一页容量
    slots-per-level: 45
    # 逻辑容量上限（9~4500），默认十页；不是原版库存尺寸
    max-slots: 450
    # 谁能购买时长 / 升级（MEMBER / OFFICER / LEADER）
    manage-rank: OFFICER
    # 购买使用时间
    rent:
      # 每 24 小时使用时间消耗的工会资金（点数）
      price-per-day: 200
      # 一次可购买的天数（管理菜单按钮 / 命令 /guild warehouse rent <天数>）
      options: [1, 7, 30]
      # 累计最多可持有的天数（0 = 不限）
      max-days: 90
    # 升级容量
    upgrade:
      # 最多可升级次数（0 = 不可升级）
      max-level: 9
      # 0 → 1 升级消耗的工会资金
      base-cost: 1000
      # 每级升级成本的倍率
      cost-growth: 2.0
  # 僵尸工会清理（不活跃工会）
  cleanup:
    # 自动定期清理开关（默认关闭，建议先用 dry-run 确认）
    enabled: false
    # 判定标准：连续多少天无活动且无人在线
    inactive-days: 30
    # 自动检查间隔（分钟）
    interval-minutes: 360
    # 仅清理成员数不超过该值的工会（0 = 不限；用于保护大型工会）
    max-members: 0
    # 试运行：只记录不删除
    dry-run: false
    # 清理时是否全服广播
    broadcast: false
