# ==========================================================
#  LiuGuild · 工会玩法模块（guild.yml）
#  仅本文件负责「工会」相关设置，与 war.yml / kit.yml 解耦。
# ==========================================================

guild:
  name:
    min-length: 2
    max-length: 16
  tag:
    min-length: 2
    max-length: 5
  # 创建费用（需 Vault 经济；无经济插件时忽略）
  create-cost: 10000.0
  # 基础成员上限
  max-members: 50
  # 每提升 1 级增加的成员上限
  max-members-per-level: 5
  invite:
    expire-seconds: 300
    cooldown-seconds: 30
  bank:
    enabled: true
    # 存款手续费百分比（0 = 不收）
    deposit-tax-percent: 0.0
  level:
    base-required-points: 1000
    required-growth: 1.5
    max-level: 20
  # 同会成员之间是否免伤（true = 允许互相攻击，默认 false）
  friendly-fire: false
  # 官员（副会长）权限
  officer:
    invite: true
    kick: true
    declare-war: true
    set-notice: true
  # 工会图标：见 icons.yml 定义可用图标
  icon:
    # 新工会默认图标 id（对应 icons.yml 的键）
    default: "default"
    # 更换图标费用（需 Vault）
    change-cost: 5000.0
  # 工会驻地（需 HuskHomes；未安装时自动禁用）
  home:
    enabled: true
    # 最多可用驻地数量（受等级限制）
    max-slots: 3
    # 每多少级多开放 1 个驻地
    levels-per-slot: 5
    # 传送冷却（秒）
    cooldown-seconds: 30
    # 传送前等待（秒，0 = 立即；需在 HuskHomes 允许范围内）
    warmup-seconds: 3
    # 工会战期间是否禁止使用驻地
    deny-in-war: true
  # 僵尸工会清理（不活跃工会）
  cleanup:
    # 自动定期清理开关（默认关闭，建议先用 dry-run 确认）
    enabled: false
    # 判定标准：连续多少天无活动且无人在线
    inactive-days: 30
    # 自动检查间隔（分钟）
    interval-minutes: 360
    # 仅清理成员数不超过该值的工会（0 = 不限；用于保护大型工会）
    max-members: 0
    # 试运行：只记录不删除
    dry-run: false
    # 清理时是否全服广播
    broadcast: false
