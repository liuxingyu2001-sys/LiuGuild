# ==========================================================
#  LiuGuild · 工会战模式模块（war-modes.yml）
#  每一种工会战模式在这里独立配置，互不影响。
#  未显式填写的项会继承 war.yml 的 war.defaults。
#  场地通过 arena 字段引用 arena.yml 中定义的竞技场 id。
# ==========================================================

modes:

  # ----------------------------------------------------------
  #  匹配工会战：玩家在工会菜单点击「参与匹配」，凑齐两队即可开战
  # ----------------------------------------------------------
  match:
    enabled: true
    display: "匹配工会战"
    description: "随时匹配，人满即战。"
    # 引用 arena.yml 中的竞技场
    arena: main
    # 是否发放完全相同的公平装备
    fair-equipment: true
    # 是否屏蔽 LuckyPeaches 蟠桃血量加成，保证公平血量
    fair-health: true
    # 使用 kit.yml 中的哪套装备
    kit: default
    team-size: 10
    min-members: 1
    min-level: 1
    # 生命规则：每人初始生命数（含当前命）；人数不等时双方总生命池相同
    lives:
      per-player: 3
      balance-teams: true
      respawn-delay-seconds: 3
    # 准备阶段：玩家传送入场后的等待时间（秒）。
    # 这段时间内参赛者会被「锁定」（禁止移动/转视角/跳跃/交互），
    # 保证开战瞬间双方都站在出生点上。想让匹配后尽快开打就调小它。
    prepare-seconds: 15
    duration-seconds: 600
    settle-seconds: 10
    allow-spectators: true
    # 准备阶段锁定参赛者（冻结移动/视角/跳跃/交互），倒计时结束才放开，保证开战瞬间站位固定
    freeze-on-prepare: true
    # 准备阶段是否允许跳跃（默认 false，连按空格也不会跳）
    allow-jump-on-prepare: false
    # 准备阶段在出生点脚下自动垫一层屏障，从物理上彻底禁止起跳（默认开）
    prepare-platform: true
    # 玩家点击参与匹配时全服广播提示
    broadcast-queue: true
    score:
      kill: 1
      death: -1
      objective: 5
    rewards:
      # Vault 个人金币（发给每位参赛者）
      win-player-money: 500.0
      lose-player-money: 100.0
      # 工会资金（点数，发给工会）；匹配战已下调，避免刷分
      win-guild-funds: 800
      lose-guild-funds: 100
      # 每个工会每天通过工会战最多获得的工会资金（0 = 不限）
      daily-guild-funds-cap: 2000
      win-pass-xp: 500
      lose-pass-xp: 100
      pass-id: ""
      win-title-id: 0
      # ------------------------------------------------------
      #  自定义额外奖励：每一项 = 名称 + 指令（名称就是结算消息里显示的文字）
      #  scope: both（默认，双方）/ win（仅胜方）/ lose（仅负方，含平局）
      #  可用占位符：{player} {uuid} {guild} {guild_id} {mode} {score} {enemy_score}
      #  结算时分行列出的只有「实际发出去的」奖励，没配置/为 0 的项不会显示。
      # ------------------------------------------------------
      extra: []
      #  - name: 金币 x1000
      #    commands:
      #      - "money give {player} 1000"
      #  - name: 3 颗钻石
      #    commands:
      #      - "give {player} diamond 3"
      #  - name: 7 天 VIP 权限
      #    scope: win
      #    commands:
      #      - "lp user {player} permission settemp liuguild.vip true 7d"

  # ----------------------------------------------------------
  #  赛季工会战：按时间表自动开启的赛季赛事
  #  schedule 支持："20:00"（每天）、"sat 20:00"、"mon-fri 20:00"、"* 20:00"
  # ----------------------------------------------------------
  season:
    enabled: true
    display: "赛季工会战"
    description: "赛季限时开启，奖励更丰厚。"
    arena: main
    fair-equipment: true
    # 是否屏蔽 LuckyPeaches 蟠桃血量加成，保证公平血量
    fair-health: true
    kit: season
    team-size: 10
    min-members: 2
    min-level: 3
    lives:
      per-player: 3
      balance-teams: true
      respawn-delay-seconds: 5
    prepare-seconds: 30
    duration-seconds: 900
    settle-seconds: 15
    allow-spectators: true
    # 准备阶段锁定参赛者（冻结移动/视角/跳跃/交互），倒计时结束才放开
    freeze-on-prepare: true
    allow-jump-on-prepare: false
    prepare-platform: true
    broadcast-queue: true
    score:
      kill: 2
      death: -1
      objective: 10
    rewards:
      win-player-money: 1200.0
      lose-player-money: 300.0
      win-guild-funds: 12000
      lose-guild-funds: 3000
      # 赛季奖励更高，单独抬高每日上限
      daily-guild-funds-cap: 20000
      win-pass-xp: 1500
      lose-pass-xp: 300
      pass-id: ""
      win-title-id: 0
    # ---- 赛季时间表 ----
    schedule:
      - "sat 20:00"
      - "sun 20:00"
    season:
      melee: true
      # 排名奖励：工会公共资金。同名次同奖励；未配置名次不发资金。
      rank-rewards:
        '1': 5000
        '2': 3000
        '3': 1000
      # 到点后开放报名/匹配的窗口时长（分钟）
      window-minutes: 10
      # 到点是否自动把符合条件的工会加入匹配队列
      auto-enqueue: true
      # 赛季奖励点数倍率
      points-multiplier: 1.0

  # ----------------------------------------------------------
