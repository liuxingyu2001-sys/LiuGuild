# ==========================================================
#  LiuGuild 主配置（config.yml）
# ----------------------------------------------------------
#  配置按功能模块拆分，各模块独立成文件，改一个模块无需碰其它文件：
#    config.yml        本服系统设置（server-id 见 server.yml）
#    database.yml      数据库
#    cross-server.yml  跨服 Redis / 传送 / 心跳
#    guild.yml         工会玩法、权限、银行、图标费用
#    war.yml           工会战全局设置与模式默认值
#    war-modes.yml     各工会战模式（匹配 / 赛季 / 自定义）
#    arena.yml         竞技场场地（模板 / 世界 / 出生点 / 承办服）
#    kit.yml           工会战统一装备（可多套）
#    gui.yml           GUI 菜单布局
#    icons.yml         工会图标定义
#    messages.yml      多语言消息
#  多台子服可把 settings.shared-config-path 指向同一共享目录，改一处全服生效。
#  server-id 在 plugins/LiuGuild/server.yml 设置（每服独立，不参与共享）。
# ==========================================================

settings:
  # 共享配置目录；留空 = 使用插件自己的目录。
  # 该键从 plugins/LiuGuild/config.yml 读取（每服可不同），共享目录内的同名键不生效。
  shared-config-path: ""
  # 轮询共享配置变化并自动热重载
  auto-reload-config: true
  # 语言（messages.yml 内的语言段）
  language: zh_CN
  # 调试日志
  debug: false

# 可选插件钩子（未安装对应插件时自动跳过，不影响启动）。
hooks:
  mcmmo:
    # mcMMO 兼容总开关，默认开启。
    enabled: true
    # 工会战期间静默屏蔽 mcMMO 技能/能力（对参赛者生效，保证公平竞技）。
    suppress-abilities-in-war: true
    # 工会战期间静默屏蔽 mcMMO 技能经验（默认关闭）。
    suppress-xp-in-war: false
  webhook:
    # 启用后把战报/赛季/工会升级等推送到 Discord 或通用 JSON webhook
    enabled: false
    # 例：https://discord.com/api/webhooks/xxx/yyy
    url: ""
    # discord = {"content":"...","username":"..."}；generic = {"content":"..."}
    format: discord
    username: "LiuGuild"
    timeout-seconds: 5
    # 非 2xx 时重试次数（指数退避 1s/2s/4s）
    retries: 2
    events:
      war-result: true
      season-result: true
      guild-level-up: true
      guild-create: false
      guild-disband: true
      application: true

  qqbot:
    # QQ 官方机器人（QQ 开放平台），默认关闭
    enabled: false
    # 机器人 AppID / ClientSecret（只在共享配置填写，勿提交公开仓库）
    app-id: ""
    client-secret: ""
    sandbox: false
    # 默认 33554432 = 群聊@ + C2C；需要频道@消息时再加 512
    intents: 33554432
    # 主动推送目标：channel / group / c2c；留空只响应@消息
    push:
      type: ""
      id: ""
    # @机器人 指令前缀
    command-prefix: "!"
    reconnect-seconds: 5

  liupass:
    # 向 Liupass 上报工会玩法任务进度（需要 Liupass 1.6.3+ 的扩展任务类型）。
    # 在 Liupass 任务里直接用 type: liuguild:xxx 定义，无需再创建同 ID 的 CUSTOM 任务。
    enabled: true
    # 加入工会（liuguild:join）
    join: true
    # 创建工会（liuguild:create）
    create: true
    # 参与一场工会战，target 为模式 ID（liuguild:war）
    war: true
    # 赢得一场工会战，target 为模式 ID（liuguild:war-win）
    war-win: true
    # 工会战中的击杀，target 为模式 ID（liuguild:war-kill）
    war-kill: true
    # 完成每日签到（liuguild:checkin）
    checkin: true
    # 捐献个人工会资金，进度为捐献金额（liuguild:donate）
    donate: true
    # 向工会银行存入金币，进度为金额（liuguild:bank-deposit）
    # 成员可循环存取刷进度，默认关闭
    bank-deposit: false
    # 兼容旧版 tasks.yml（按 liupass 任务 ID 上报 addTaskProgress）
    legacy-task-ids: true

# 聊天频道
channels:
  # LiuChat 工会频道消息格式（占位符由 LiuChat 提供，支持颜色代码）
  guild-format: "&a[${channel_name}] &f${player}&7: ${message}"
