# ==========================================================
#  LiuGuild 主配置（config.yml）
# ----------------------------------------------------------
#  配置按功能模块拆分，各模块独立成文件，改一个模块无需碰其它文件：
#    config.yml        本服系统设置（server-id 见 server.yml）
#    database.yml      数据库
#    cross-server.yml  跨服 Redis / 传送 / 心跳
#    guild.yml         工会玩法、权限、银行、图标费用
#    war.yml           工会战全局设置与模式默认值
#    war-modes.yml     各工会战模式（匹配 / 赛季 / 自定义）
#    arena.yml         竞技场场地（模板 / 世界 / 出生点 / 承办服）
#    kit.yml           工会战统一装备（可多套）
#    gui.yml           GUI 菜单布局
#    icons.yml         工会图标定义
#    messages.yml      多语言消息
#  多台子服可把 settings.shared-config-path 指向同一共享目录，改一处全服生效。
#  server-id 在 plugins/LiuGuild/server.yml 设置（每服独立，不参与共享）。
# ==========================================================

settings:
  # 共享配置目录；留空 = 使用插件自己的目录。
  # 该键从 plugins/LiuGuild/config.yml 读取（每服可不同），共享目录内的同名键不生效。
  shared-config-path: ""
  # 轮询共享配置变化并自动热重载
  auto-reload-config: true
  # 语言（messages.yml 内的语言段）
  language: zh_CN
  # 调试日志
  debug: false

# 可选插件钩子（未安装对应插件时自动跳过，不影响启动）。
hooks:
  mcmmo:
    # 工会战期间完全屏蔽 mcMMO：技能/能力不激活，聊天与动作栏等全部提示取消。
    block-in-war: true
  pets:
    # 工会战期间屏蔽 mcPets/LiuPets 与 MyPet：禁止召唤、骑乘、宠物技能，并移除已有宠物。
    # 未安装对应宠物插件时自动跳过；参赛者、旁观者和赛季战斗玩家均生效。
    block-in-war: true
  # webhook / QQ 机器人属于每服独立配置，请在 server.yml 配置，不要放共享 config.yml。
  player-title:
    # 用 PlayerTitle 把「工会名」显示成玩家称号。
    # 原理：PlayerTitle 称号名支持 PlaceholderAPI 变量（聊天 / Tab 显示时解析），
    #      而 LiuGuild 已注册 %liuguild_name%，所以所有公会共用一个称号即可，
    #      工会改名也会生效（聊天实时，Tab 前缀在本服立即、跨服在下一次对账内刷新），
    #      不需要给每个公会单独建称号。只占展示槽，不会顶掉玩家的 buff / 粒子称号。
    # 前置：已安装 PlaceholderAPI，且启动顺序上 PlayerTitle 能检测到它（先装 PAPI 再启服）。
    # 使用步骤：
    #   1) 在 PlayerTitle 里创建一个隐藏（"是否显示" 填 false）、永久、免费的称号，记下返回的称号 ID：
    #        /plt title add not &b%liuguild_name_title% 0 0 false
    #      （称号名不用纠结：启用后本插件会按下面的 name 配置自动同步称号名。）
    #   2) 把称号 ID 填到下面 title-id，并把 enabled 改成 true，重载配置或重启。
    guild-title:
      enabled: false
      # 管理员在 PlayerTitle 里创建的「工会名」称号 ID；0 = 未配置，功能跳过。
      title-id: 0
      # 称号显示文本（PlayerTitle 里该称号的名称，本插件会在启用/重载时自动同步）。
      # 必须包含 %liuguild_name%（或 %liuguild_name_title%），其余文字/颜色代码会原样显示
      # （PlayerTitle 用 MiniMessage 渲染）：
      #   "%liuguild_name_title%"       → 工会名 + 空格 + 头衔（默认）：星辰 会长；
      #                                  未手动装备固定头衔时自动用职位（成员/副会长/会长）
      #   "%liuguild_name%工会"        → 某某工会
      #   "&7[&b%liuguild_name%&7]工会" → [某某]工会
      #   "%liuguild_name%&7工会"       → 工会名按各自颜色，后缀灰色
      #   渐变也可用： "<gradient:#00E5FF:#FF00FF>%liuguild_name%</gradient>&7工会"
      # 想保留「工会」字样又想带职位：
      #   "%liuguild_name%工会%liuguild_title_spaced%" → 星辰工会 会长
      # 职位文本与开关在 guild.yml 的 titles.auto-rank 配置。
      name: "%liuguild_name_title%"
      # 在线玩家称号对账间隔（秒），0 = 关闭。用于兜底手动换称号、跨服入退会与漏事件。
      recheck-seconds: 60
      # true = 始终把工会称号设为展示称号（会替换玩家当前的展示称号，但不影响其 buff / 粒子称号）；
      # false = 仅在玩家当前没有展示称号时佩戴。
      force: true

  liupass:
    # 向 Liupass 上报工会玩法任务进度（需要 Liupass 1.6.3+ 的扩展任务类型）。
    # 在 Liupass 任务里直接用 type: liuguild:xxx 定义，无需再创建同 ID 的 CUSTOM 任务。
    enabled: true
    # 加入工会（liuguild:join）
    join: true
    # 创建工会（liuguild:create）
    create: true
    # 参与一场工会战，target 为模式 ID（liuguild:war）
    war: true
    # 赢得一场工会战，target 为模式 ID（liuguild:war-win）
    war-win: true
    # 工会战中的击杀，target 为模式 ID（liuguild:war-kill）
    war-kill: true
    # 完成每日签到（liuguild:checkin）
    checkin: true
    # 捐献个人工会资金，进度为捐献金额（liuguild:donate）
    donate: true
    # 向工会银行存入金币，进度为金额（liuguild:bank-deposit）
    # 成员可循环存取刷进度，默认关闭
    bank-deposit: false
    # 兼容旧版 tasks.yml（按 liupass 任务 ID 上报 addTaskProgress）
    legacy-task-ids: true

# 聊天频道
channels:
  # LiuChat 工会频道消息格式（占位符由 LiuChat 提供，支持颜色代码）
  guild-format: "&a[${channel_name}] &f${player}&7: ${message}"
