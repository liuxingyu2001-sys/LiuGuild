# LiuGuild · 竞技场（arena.yml）
# 固定场地只需：承办服、世界、出生点。
# 点名按字母排序，前半组给A队，后半组给B队，队内循环分配。
# 例如 a～f：A队用a/b/c，B队用d/e/f。spectator为旁观点，不参与分配。
# /guildadmin arena setspawn main a  在当前位置设置点a，并保存世界名。
# /guildadmin arena setspawn main b  设置点b；继续用c/d/e/f可添加更多点。
# /guildadmin arena setspawn main spec  设置旁观点。
# war-modes.yml 中用 arena: main 引用场地；点位至少配置两个。
arenas:
  main:
    server: ""
    # 可选承办服池：例如 [zy, 99, fb]；非空时优先于 server，按忙碌/最近使用选择
    hosts: []
    # KOTH 占点模式使用；普通模式无需填写。半径按 3D 距离计算。
    # koth: { x: 0.0, y: 70.0, z: 0.0, radius: 6 }
    world: ""
    spawn-a: { x: 0.5, y: 70.0, z: 0.5, yaw: 0.0, pitch: 0.0 }
    spawn-b: { x: 20.5, y: 70.0, z: 0.5, yaw: 180.0, pitch: 0.0 }
    spawn-spectator: { x: 10.5, y: 80.0, z: 10.5, yaw: 0.0, pitch: 30.0 }

# 可选高级设置不需要时省略，详细配置见 docs/arena.md：
# 全局 pregenerate（默认true）、create-timeout-seconds（默认60）。
# 场地可加 template（liudungeon模板）、radius（预热半径，默认48）。
# temporary-world 用于临时世界；固定世界不需填写。
# after-war 默认 auto-return: true、return-delay-seconds: 0，无需填写。
