# ==========================================================
#  LiuGuild · GUI 菜单模块（gui.yml）
#  所有菜单、按钮、图标均可在此配置；material 支持原生材质或 CE:命名空间:id。
#  占位符 {xxx} 与 PAPI 占位符 %xxx% 均会在渲染时替换。
# ==========================================================

gui:
  # 界面引擎：legacy = 内置库存 GUI；auto = 优先 Sparrow UI，失败自动回退；sparrow = 强制 Sparrow UI
  engine: auto
  # 是否用 Sparrow 铁砧界面收集输入（创建工会 / 金额 / 公告等）；关闭则回退聊天栏输入。
  anvil-input: true
  # 通用填充物
  filler:
    enabled: true
    material: GRAY_STAINED_GLASS_PANE
    name: " "

  # ---------------- 工会主菜单 ----------------
  main:
    title: "<gradient:#3AA0FF:#8AD4FF><bold>{guild}</bold></gradient> <dark_gray>· 工会"
    rows: 6
    buttons:
      info:
        slot: 4
        material: "CE:liuguild:emblem_default"
        fallback-material: SHIELD
        name: "<white>{guild} <dark_gray>[{tag}]"
        lore:
          - "<gray>会长：<white>{leader}"
          - "<gray>等级：<white>{level} <dark_gray>/ {max_level}"
          - "<gray>成员：<white>{members}<gray>/<white>{member_limit}"
          - "<gray>工会资金：<white>{points}"
          - "<gray>战绩：<white>{wins} 胜 {losses} 负"
          - "<gray>银行：<white>{bank}"
          - ""
          - "<yellow>公告：<white>{notice}"
      members:
        slot: 19
        material: PLAYER_HEAD
        name: "<white>成员列表"
        lore: ["<gray>查看并管理工会成员"]
      war:
        slot: 20
        material: NETHERITE_SWORD
        name: "<white>工会战"
        lore: ["<gray>匹配 / 查看战况 / 历史战绩"]
      bank:
        slot: 21
        material: GOLD_INGOT
        name: "<white>工会银行"
        lore: ["<gray>余额：<white>{bank}", "<gray>左键存入 / 右键取出"]
      home:
        slot: 22
        material: COMPASS
        name: "<white>工会驻地"
        lore: ["<gray>可用槽位：<white>{home_slots}", "<gray>左键传送 / 右键设置"]
      checkin:
        slot: 23
        material: CLOCK
        name: "<white>每日签到"
        lore: ["<gray>连续签到：<white>{checkin_streak} 天", "<gray>今日：<white>{checkin_state}", "<gray>消耗：<white>{checkin_cost}", "", "<yellow>点击签到"]
      settings:
        slot: 24
        material: REDSTONE_TORCH
        name: "<white>工会设置"
        lore: ["<gray>图标 / 公告 / 简介 / 改名字 / 加入方式"]
      list:
        slot: 25
        material: WRITABLE_BOOK
        name: "<white>工会列表"
        lore: ["<gray>浏览全服工会"]
      warehouse:
        slot: 28
        material: CHEST
        name: "<white>工会仓库"
        lore: ["<gray>跨服共享物品存储", "<gray>同一时间只能一人打开", "", "<yellow>点击打开"]
      titles:
        slot: 29
        material: NAME_TAG
        name: "<white>工会头衔"
        lore: ["<gray>自定义工会称号", "<gray>选一个装备在自己名字旁", "", "<yellow>点击查看"]

  # ---------------- 工会详情面板（点击主菜单名片 / 列表右键） ----------------
  info:
    title: "<white>工会详情 <dark_gray>· {guild}"
    rows: 5
    buttons:
      card:
        slot: 4
        material: "CE:liuguild:emblem_default"
        fallback-material: SHIELD
        name: "<white>{guild} <dark_gray>[{tag}]"
        lore:
          - "<gray>会长：<white>{leader}"
          - "<gray>等级：<white>{level} <dark_gray>/ {max_level}"
          - "<gray>成员：<white>{members}<gray>/<white>{member_limit}<gray>　在线：<white>{online}"
          - "<gray>工会资金：<white>{points}"
          - "<gray>升级进度：<white>{level_progress}"
          - "<gray>建立于：<white>{created}"
      info_notice:
        slot: 19
        material: PAPER
        name: "<white>工会公告"
        lore: ["<gray>{notice}"]
      info_desc:
        slot: 21
        material: WRITABLE_BOOK
        name: "<white>工会简介"
        lore: ["<gray>{description}"]
      info_members:
        slot: 23
        material: PLAYER_HEAD
        name: "<white>成员列表"
        lore: ["<gray>共 <white>{members}</white> 名成员", "<gray>在线 <white>{online}</white> 人", "", "<yellow>点击查看"]
      info_history:
        slot: 25
        material: NETHERITE_SWORD
        name: "<white>工会战战绩"
        lore: ["<gray>胜：<white>{wins}", "<gray>负：<white>{losses}", "<gray>胜率：<white>{win_rate}", "<gray>总场次：<white>{total_wars}", "", "<yellow>点击查看历史"]
      info_back:
        slot: 40
        material: ARROW
        name: "<white>返回"

  # ---------------- 成员菜单 ----------------
  members:
    title: "<white>工会成员 <dark_gray>· {guild}"
    rows: 6
    entry:
      # 成员头像物品（PLAYER_HEAD 会显示玩家皮肤）
      material: PLAYER_HEAD
      name: "<white>{player} <dark_gray>[{rank}] <gray>{title}"
      lore:
        - "<gray>职位：<white>{rank}"
        - "<gray>头衔：<white>{title}"
        - "<gray>贡献：<white>{contributed}"
        - "<gray>击杀/死亡：<white>{kills}<gray>/<white>{deaths}"
        - "<gray>加入：<white>{joined}"
        - ""
        - "<yellow>左键晋升 / 右键降级"
        - "<gold>Shift+左键 转让会长"
        - "<red>Shift+右键 踢出成员"
    back:
      slot: 49
      material: ARROW
      name: "<white>返回"

  # ---------------- 工会列表菜单 ----------------
  list:
    title: "<white>工会列表 <dark_gray>· 共 {count} 个"
    rows: 6
    entry:
      material: "CE:liuguild:emblem_default"
      fallback-material: SHIELD
      name: "<white>{guild} <dark_gray>[{tag}]"
      lore:
        - "<gray>会长：<white>{leader}"
        - "<gray>等级：<white>{level}"
        - "<gray>成员：<white>{members}"
        - "<gray>工会资金：<white>{points}"
        - "<gray>战绩：<white>{wins} 胜 {losses} 负"
        - ""
        - "<yellow>左键申请加入"
        - "<aqua>右键查看详情"
    back:
      slot: 49
      material: ARROW
      name: "<white>返回"
      # 仅当玩家未入会时显示
    buttons:
      create:
        slot: 47
        material: NETHER_STAR
        name: "<green>创建工会"
        lore: ["<gray>点击后在聊天栏输入工会名称"]

  # ---------------- 无工会引导菜单（新玩家首次打开 /guild gui） ----------------
  noguild:
    title: "<white>还没有工会 <dark_gray>· 选择一个开始"
    rows: 3
    buttons:
      create:
        slot: 11
        material: NETHER_STAR
        name: "<green>创建工会"
        lore: ["<gray>建立一个属于你的工会", "<gray>点击后在聊天栏输入名称"]
      list:
        slot: 13
        material: WRITABLE_BOOK
        name: "<white>浏览工会列表"
        lore: ["<gray>查看全服工会", "<gray>开放加入的可直接申请"]
      help:
        slot: 15
        material: PAPER
        name: "<white>如何加入工会"
        lore: ["<gray>· 在列表中点开放加入的工会申请", "<gray>· 或等待会长 / 官员邀请"]
      close:
        slot: 22
        material: BARRIER
        name: "<red>关闭"

  # ---------------- 工会设置菜单 ----------------
  settings:
    title: "<white>工会设置 <dark_gray>· {guild}"
    rows: 5
    buttons:
      rename:
        slot: 10
        material: NAME_TAG
        name: "<white>工会改名字"
        lore:
          - "<gray>当前名称：<white>{guild}"
          - "<gray>当前标签：<white>{tag}"
          - "<gray>可同时修改名称与标签"
          - "<gray>冷却：<white>{rename_cooldown}"
          - "<gray>费用：<white>{rename_cost}"
          - ""
          - "<yellow>点击后在铁砧界面输入新名称"
      icon:
        slot: 12
        material: SHIELD
        name: "<white>更换图标"
        lore: ["<gray>当前：<white>{icon_name}", "<gray>费用：<white>{icon_cost}"]
      toggle_open:
        slot: 14
        material: OAK_DOOR
        name: "<white>加入方式：<yellow>{open}"
        lore: ["<gray>点击切换 开放 / 邀请"]
      notice:
        slot: 16
        material: PAPER
        name: "<white>修改公告"
        lore: ["<gray>当前：<white>{notice}", "<gray>点击后输入新公告"]
      desc:
        slot: 28
        material: WRITABLE_BOOK
        name: "<white>修改简介"
        lore: ["<gray>当前：<white>{description}", "<gray>点击后输入新简介"]
      # ---- 危险操作：从主菜单移到这里，避免玩家在主界面误点 ----
      leave:
        slot: 39
        material: OAK_DOOR
        name: "<red>退出工会"
        lore: ["<gray>离开当前工会（需确认）", "<dark_red>此操作不可恢复"]
      disband:
        slot: 41
        material: TNT
        name: "<dark_red>解散工会"
        lore: ["<gray>解散整个工会（仅会长）", "<dark_red>此操作不可恢复"]
      back:
        slot: 40
        material: ARROW
        name: "<white>返回"

  # ---------------- 图标选择菜单 ----------------
  icons:
    title: "<white>选择工会图标"
    rows: 4
    entry:
      slot: -1
      material: SHIELD
      name: "<white>{icon_name}"
      lore: ["<gray>点击使用", "<gray>费用：<white>{icon_cost}"]
    back:
      slot: 31
      material: ARROW
      name: "<white>返回"

  # ---------------- 工会战菜单 ----------------
  war:
    title: "<white>工会战 <dark_gray>· {guild}"
    rows: 5
    # 每种工会战模式一个条目（动态生成，点击参与匹配）
    entry:
      slot: -1
      material: NETHERITE_SWORD
      name: "<white>{mode}"
      lore:
        - "<gray>状态：<yellow>{mode_state}"
        - "<gray>场地：<white>{mode_arena}"
        - "<gray>人数：<white>{mode_team} <gray>最低 <white>{mode_min}"
        - "<gray>公平：<white>{mode_fair} / {mode_health}"
        - "<gray>时长：<white>{mode_duration} 秒"
        - "<gray>时间表：<white>{mode_schedule}"
        - ""
        - "<yellow>点击参与该模式匹配"
    buttons:
      status:
        slot: 36
        material: COMPASS
        name: "<white>当前战况"
        lore: ["<gray>状态：<white>{state}", "<gray>对手：<white>{enemy}", "<gray>比分：<white>{score} : {enemy_score}", "<gray>我的剩余生命：<white>{lives}", "<gray>场地：<white>{arena}", "<gray>承办服：<white>{host}", "", "<yellow>点击刷新"]
      spectate:
        slot: 38
        material: ENDER_EYE
        name: "<white>旁观比赛"
        lore: ["<gray>传送到本服进行中的工会战", "<gray>以旁观者身份观看"]
      leave_queue:
        slot: 40
        material: BARRIER
        name: "<red>退出匹配"
        lore: ["<gray>当前正在匹配中"]
      history:
        slot: 42
        material: PAPER
        name: "<white>历史战绩"
        lore: ["<gray>累计 {history_count} 场"]
      back:
        slot: 44
        material: ARROW
        name: "<white>返回"

  # ---------------- 管理菜单 ----------------
  admin:
    title: "<gold><bold>LiuGuild</bold></gold> <dark_gray>· 管理面板"
    rows: 6
    buttons:
      admin_status:
        slot: 10
        material: BOOK
        name: "<white>插件状态"
        lore:
          - "<gray>server-id：<white>{server}"
          - "<gray>存储：<white>{storage}"
          - "<gray>跨服：<white>{cross}"
          - "<gray>工会数：<white>{guild_count}"
          - "<gray>匹配队列：<white>{queue}"
          - "<gray>进行中：<white>{live_wars}"
          - ""
          - "<yellow>点击查看详细状态"
      admin_arena:
        slot: 12
        material: GRASS_BLOCK
        name: "<white>竞技场"
        lore: ["<gray>图形化编辑场地", "<gray>出生点 / 世界 / 临时世界 / 集合点", "", "<yellow>点击打开"]
      admin_modes:
        slot: 14
        material: NETHERITE_SWORD
        name: "<white>工会战模式"
        lore: ["<gray>查看各模式配置"]
      admin_kits:
        slot: 16
        material: DIAMOND_CHESTPLATE
        name: "<white>装备套装"
        lore: ["<gray>浏览 / 保存 / 删除套装", "<gray>用当前身上装备创建快照", "", "<yellow>点击打开"]
      admin_guilds:
        slot: 20
        material: SHIELD
        name: "<white>工会管理"
        lore: ["<gray>浏览全部工会", "<gray>改名字 / 等级 / 资金 / 银行 / 公告", "<gray>强制解散", "", "<yellow>点击打开"]
      admin_wars:
        slot: 22
        material: NETHERITE_SWORD
        name: "<white>工会战管理"
        lore: ["<gray>查看进行中的比赛", "<gray>改比分 / 传送 / 强制结束", "", "<yellow>点击打开"]
      admin_verify:
        slot: 24
        material: WRITABLE_BOOK
        name: "<white>数据校验"
        lore: ["<gray>校验 member_count / 会长 / 成员索引", "<gray>使用 /guildadmin verify fix 修复", "", "<yellow>点击校验"]
      admin_cleanup:
        slot: 30
        material: HOPPER
        name: "<white>僵尸工会清理"
        lore: ["<gray>扫描不活跃工会（试运行）", "<gray>使用 /guildadmin cleanup confirm 删除", "", "<yellow>点击扫描"]
      admin_reload:
        slot: 32
        material: REDSTONE
        name: "<white>重载配置"
        lore: ["<gray>重新加载全部模块"]
      close:
        slot: 40
        material: BARRIER
        name: "<red>关闭"
        lore: ["<gray>关闭菜单"]
