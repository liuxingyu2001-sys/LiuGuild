# 旧版 liupass 对接：按任务 ID 推进已有的 CUSTOM 任务。
# 新的推荐做法是在 liupass 任务里直接写 type: liuguild:war / liuguild:checkin 等扩展类型，
# 不需要本文件；本文件仅为兼容旧配置保留，可用 config.yml 的 hooks.liupass.legacy-task-ids 关闭。
# pass-id 留空使用玩家默认通行证。BANK_DEPOSIT 默认关闭：存取循环可能刷进度。
enabled: true
bindings:
  join:
    event: JOIN
    task-id: guild_join
    pass-id: ""
  create:
    event: CREATE
    task-id: guild_create
    pass-id: ""
  play:
    event: WAR_PLAY
    task-id: guild_war_play
    pass-id: ""
  win:
    event: WAR_WIN
    task-id: guild_war_win
    pass-id: ""
  deposit:
    enabled: false
    event: BANK_DEPOSIT
    count-amount: true
    task-id: guild_bank_deposit
    pass-id: ""
