# ==========================================================
#  LiuGuild · 每服独立配置（server.yml）
#  该文件【不会】随共享配置同步，用于给每台子服设置不同的值。
#  config.yml 里对应的项可留空/默认，由本文件按需覆盖。
# ==========================================================

# 本服在群组中的唯一标识（必填，且每台子服不同）；留空则自动生成并写回本文件。
server-id: ""

# 以下均为可选覆盖；留空 = 用 config.yml 的值。
# 语言（messages.yml 内的语言段）
language: ""
# 调试日志（true/false）；这里留空则用 config.yml
# debug: false
# 共享配置变化时是否自动热重载（true/false）
# auto-reload-config: true
