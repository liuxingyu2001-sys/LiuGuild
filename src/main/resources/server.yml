# LiuGuild · 每服独立配置，不随共享配置同步。
# 必须与代理登记的本服名称一致，例如 99 / zy / fb；每台子服不同。
server-id: ""

# 竞技场承办位置在 arena.yml 的 arenas.<id>.server 设置，
# 不需要开启本服承办模式。

# 可选：本服语言，留空使用共享配置。
language: ""
# debug: false
# auto-reload-config: true

# 可选：仅在本服覆盖某个模块的设置，不写回共享目录。
# overrides:
#   config.yml:
#     hooks.mcmmo.enabled: true
#   cross-server.yml:
#     transfer.enabled: true

# 外部通知属于每服独立配置：只在本服 server.yml 填写。
# 多台子服同时启用会重复建连/重复推送，建议只在一台启用（或分别使用不同目标）。
webhook:
  enabled: false
  url: ""
  format: discord
  username: "LiuGuild"
  timeout-seconds: 5
  retries: 2
  events:
    war-result: true
    season-result: true
    guild-level-up: true
    guild-create: false
    guild-disband: true
    application: true

qqbot:
  enabled: false
  app-id: ""
  client-secret: ""
  sandbox: false
  intents: 33554432
  push:
    type: ""
    id: ""
  command-prefix: "!"
  reconnect-seconds: 5
