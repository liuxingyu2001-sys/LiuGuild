# LiuGuild · 每服独立配置，不随共享配置同步。
# 必须与代理登记的本服名称一致，例如 99 / zy / fb；每台子服不同。
server-id: ""

# 竞技场承办位置在 arena.yml 的 arenas.<id>.server 设置，
# 不需要开启本服承办模式。

# 可选：本服语言，留空使用共享配置。
language: ""
# debug: false
# auto-reload-config: true

# 可选：仅在本服覆盖某个模块的设置，不写回共享目录。
# overrides:
#   config.yml:
#     hooks.mcmmo.enabled: true
#   cross-server.yml:
#     transfer.enabled: true
