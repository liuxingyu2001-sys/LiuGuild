# LiuGuild · 每服独立配置，不随共享配置同步。
# 必须与代理登记的本服名称一致，例如 99 / zy / fb；每台子服不同。
server-id: ""

# 竞技场承办位置在 arena.yml 的 arenas.<id>.server 设置，
# 不需要开启本服承办模式。

# 可选：本服语言，留空使用共享配置。
language: ""
# debug: false
# auto-reload-config: true

# 可选：仅在本服覆盖某个模块的设置，不写回共享目录。
# overrides:
#   config.yml:
#     hooks.mcmmo.block-in-war: true
#   cross-server.yml:
#     transfer.enabled: true

# 外部通知属于每服独立配置：只在本服 server.yml 填写。
# 多台子服同时启用会重复建连/重复推送，建议只在一台启用（或分别使用不同目标）。
webhook:
  enabled: false
  url: ""
  format: discord
  username: "LiuGuild"
  timeout-seconds: 5
  retries: 2
  events:
    war-result: true
    season-result: true
    guild-level-up: true
    guild-create: false
    guild-disband: true
    application: true

qqbot:
  enable: false
  app-id: ""
  app-secret: ""
  sandbox: false
  connection:
    # 留空自动请求 /gateway；正式/沙箱按 sandbox 选择
    gateway: ""
    reconnect-seconds: 5
    reconnect-max-seconds: 60
    timeout-seconds: 15
  # 命名 intents：group / c2c / guild / guild-private / direct / all
  intents: [group, c2c]
  # 额外位掩码，一般留 0
  intents-bits: 0
  command-prefix: "!"
  receive:
    enable: true
    # 只接收这些会话；留空接收全部。填群 openid / 用户 openid / 频道 ID
    channels: []
    # 首次收到某会话时在控制台打印 target，方便复制到 channels
    log-targets: true
    # 单条进游戏消息最大长度
    max-length: 300
  send:
    # 主动推送总开关；指令回复不受此开关影响
    enable: false
    # 可多条：group:<群openid> / c2c:<用户openid> / channel:<频道ID> / direct:<私信频道ID>
    targets: []
    # 两条主动消息最小间隔（毫秒）
    interval-ms: 1000
    # 单条发到 QQ 的最大长度
    max-length: 2000
    # 回复@消息时是否带 msg_id（被动回复）
    passive-reply: true
