# ==========================================================
#  LiuGuild · 每服独立配置（server.yml）
#  该文件【不会】随共享配置同步，用于给每台子服设置不同的值。
#  config.yml 里对应的项可留空/默认，由本文件按需覆盖。
# ==========================================================

# 本服在群组中的唯一标识（必填，且每台子服不同）。
# 【重要】必须与代理（BungeeCord / Velocity）[servers] 里登记的本服名字完全一致，
# 例如代理里写的是 "zy" 这里就必须填 "zy"。
# 留空会自动生成一个随机 server-xxxxxxxx，它与代理名不一致，会导致
# 「A 服无法传送到承办服 B」「承办服不认领工会战」。
server-id: ""

# ==========================================================
#  每服独立的工会战承办设置（从共享的 war.yml 移出，避免多服冲突）
# ==========================================================
war:
  # true = 本服为工会战专属承办服（竞技场服），只承接工会战；普通子服保持 false
  server-mode: false
  # 本服默认承办的 server-id（留空 = 由发起匹配的服务器承办）
  dedicated-server: ""

# ==========================================================
#  其它每服独立的通用覆盖（可选）
#  格式：<模块文件名>: { 配置路径: 值 }；只影响本服，不写回共享目录。
#  用途举例：不同子服安装的插件不同 / 是否允许跨服传送等。
# ==========================================================
# overrides:
#   config.yml:
#     debug: false
#     hooks.mcmmo.enabled: true
#   cross-server.yml:
#     transfer.enabled: true

# 以下均为可选覆盖；留空 = 用 config.yml 的值。
# 语言（messages.yml 内的语言段）
language: ""
# 调试日志（true/false）；这里留空则用 config.yml
# debug: false
# 共享配置变化时是否自动热重载（true/false）
# auto-reload-config: true
